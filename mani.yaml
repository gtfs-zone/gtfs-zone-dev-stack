specs:
  # One block of output per repo, all repos at once.
  parallel:
    output: stream
    parallel: true
    ignore_errors: true
  # One repo after another, stopping at the first failure.
  serial:
    output: stream
    parallel: false
    ignore_errors: false

targets:
  # Used when a run names no project, tag or path.
  default:
    all: true

tasks:
  status:
    desc: Current branch, ahead/behind and uncommitted files
    spec: parallel
    cmd: git status --short --branch

  branches:
    desc: Branches not merged into origin/main, and merged ones still not deleted
    spec: parallel
    cmd: |
      git fetch --quiet --prune origin
      current=$(git branch --show-current)
      echo "unmerged local:"
      git branch --format='  %(refname:short)' --no-merged origin/main
      echo "unmerged remote:"
      git branch --remotes --format='  %(refname:short)' --no-merged origin/main
      echo "merged, not deleted, local:"
      git branch --format='  %(refname:short)' --merged origin/main | grep -vxE "  (main|$current)" || true
      echo "merged, not deleted, remote:"
      git branch --remotes --format='  %(refname:short)' --merged origin/main | grep -vxE '  origin(/main|/HEAD)?' || true

  check:
    desc: pnpm check and/or scripts/check.sh, whichever the repo has
    spec: serial
    cmd: |
      ran=0
      if [ -f package.json ] && grep -q '"check":' package.json; then
        pnpm check
        ran=1
      fi
      if [ -x scripts/check.sh ]; then
        scripts/check.sh
        ran=1
      fi
      [ "$ran" = 1 ] || echo "[check] $(basename "$PWD"): no pnpm check or scripts/check.sh"

  sync-agents:
    desc: Write the org repo's shared AGENTS.md block into each repo that has the markers
    spec: parallel
    cmd: |
      if grep -qxF '<!-- shared:start -->' AGENTS.md 2>/dev/null; then
        ../gtfs-zone-org-root/scripts/sync-agents.sh "$PWD"
      else
        echo "[sync-agents] $(basename "$PWD"): no shared block, skipped"
      fi

  pull:
    desc: Fetch, then fast-forward the current branch to its upstream
    spec: parallel
    cmd: |
      git fetch --quiet --prune origin
      if git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' > /dev/null 2>&1; then
        git merge --ff-only '@{upstream}'
      else
        echo "[pull] $(git branch --show-current): no upstream, fetched only"
      fi
