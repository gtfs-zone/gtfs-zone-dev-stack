# Every gtfs-zone repo, checked out as siblings of this one.
#
#   mani sync                    # clone the missing ones
#   mani run status              # every repo
#   mani run check -t python     # only repos tagged python
#
# Tags: web (pnpm apps and libraries), python (uv projects), rt (realtime
# stack), wifi (wifi.gtfs.zone), data (pipelines and the sites they build).

