[extend]
useDefault = true

[[allowlists]]
description = "Dev placeholder cookie secret (base64 of dev-local-cookie-secret-32-bytes)"
regexes = ['''^ZGV2LWxvY2FsLWNvb2tpZS1zZWNyZXQtMzItYnl0ZXM=$''']

[[allowlists]]
description = "Placeholder S3 credentials in .env.example"
condition = "AND"
paths = ['''(^|/)\.env\.example$''']
regexes = ['''^GK0123456789abcdef01234567$''', '''^(0123456789abcdef){4}$''']
