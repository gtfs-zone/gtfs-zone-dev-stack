services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  migrate:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    command: railroad-club-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: admin@local
      TRACCAR_PASSWORD: admin
      TRACCAR_CLIENT_BASE: http://localhost:5055
      INGEST_API_TOKEN: dev-ingest-token
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    restart: on-failure
    command: fastapi run src/cafe_car/admin_main.py --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
      DEBUG: "true"
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: admin@local
      TRACCAR_PASSWORD: admin
      TRACCAR_CLIENT_BASE: http://localhost:5055
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    image: ${SCHEDULE_FOAMER_IMAGE:-schedule-foamer:local}
    build:
      context: ${SCHEDULE_FOAMER_DIR:-../schedule-foamer}
    command: celery -A schedule_foamer.celery_app worker -l info
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:mysecretpassword@db:5432/postgres
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      FEED_REFRESH_INTERVAL_MINUTES: 10
      CELERY_WORKER_CONCURRENCY: 2
      CELERY_MAX_TASKS_PER_CHILD: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    image: ${SCHEDULE_FOAMER_IMAGE:-schedule-foamer:local}
    build:
      context: ${SCHEDULE_FOAMER_DIR:-../schedule-foamer}
    command: celery -A schedule_foamer.celery_app beat -l info --schedule=/app/beat/celerybeat-schedule
    restart: on-failure
    environment:
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:master
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy

  dex:
    image: ghcr.io/dexidp/dex:v2.45.0
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    command: dex serve /etc/dex/config.yaml
    ports:
      - "5556:5556"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.3
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://dex:5556
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: dev-oauth2-proxy-secret
      OAUTH2_PROXY_COOKIE_SECRET: ZGV2LWxvY2FsLWNvb2tpZS1zZWNyZXQtMzItYnl0ZXM=
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://admin:8001/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "false"
      OAUTH2_PROXY_USER_ID_CLAIM: name
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    depends_on:
      - dex
      - admin

  vehicle-poser:
    image: ${VEHICLE_POSER_IMAGE:-vehicle-poser:local}
    build:
      context: ${VEHICLE_POSER_DIR:-../vehicle-poser}
    restart: on-failure
    environment:
      HTTP_PORT: 8080
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg2://postgres:mysecretpassword@db:5432/postgres
    expose:
      - "8080"
    depends_on:
      - redis
      - migrate

  trip-updogger:
    image: ${TRIP_UPDOGGER_IMAGE:-trip-updogger:local}
    build:
      context: ${TRIP_UPDOGGER_DIR:-../trip-updogger}
    restart: on-failure
    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg2://postgres:mysecretpassword@db:5432/postgres
      POLL_INTERVAL: 5
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  traccar-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: mysecretpassword
    command: >
      sh -c "psql -h db -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='traccar'\" | grep -q 1
      || createdb -h db -U postgres traccar"
    depends_on:
      db:
        condition: service_healthy

  traccar:
    image: traccar/traccar:6.14.5
    restart: on-failure
    ports:
      - "8082:8082"
      - "5055:5055"
    volumes:
      - ./dev/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    depends_on:
      db:
        condition: service_healthy
      traccar-db-init:
        condition: service_completed_successfully
      dex:
        condition: service_started
      vehicle-poser:
        condition: service_started

  hell-gate-bridge:
    image: ${HELL_GATE_BRIDGE_IMAGE:-hell-gate-bridge:local}
    build:
      context: ${HELL_GATE_BRIDGE_DIR:-../hell-gate-bridge}
    restart: on-failure
    environment:
      SOURCE: amtrak
      POLL_INTERVAL: 15
      ROUTE_FILTER:
      CAFE_CAR_INGEST_URL: http://api:8000
      INGEST_API_TOKEN: dev-ingest-token
      # Must equal the amtrak Tracker.id provisioned via scripts/provision_source.py
      # (cafe-car's gtfs_rt.py scans vehicle:{tracker.id}:*).
      INGEST_VEHICLE_ID: amtrak-live
    volumes:
      - hell_gate_beat:/app/beat
    depends_on:
      api:
        condition: service_healthy

  hell-gate-bridge-buswhere:
    image: ${HELL_GATE_BRIDGE_IMAGE:-hell-gate-bridge:local}
    build:
      context: ${HELL_GATE_BRIDGE_DIR:-../hell-gate-bridge}
    restart: on-failure
    environment:
      SOURCE: buswhere
      POLL_INTERVAL: 15
      # Direct raw URL: the github.com/.../raw/ form 302-redirects and hell-gate's
      # httpx client does not follow redirects (fetch_gtfs would fail).
      GTFS_URL: https://raw.githubusercontent.com/columbia-county-ny-transit/gtfs-generator/refs/heads/main/columbia_county_gtfs.zip
      # Blank → poll all mapped Columbia County routes.
      BUSWHERE_ROUTES:
      CAFE_CAR_INGEST_URL: http://api:8000
      INGEST_API_TOKEN: dev-ingest-token
      # Must equal the columbia-county Tracker.id provisioned in cafe-car.
      INGEST_VEHICLE_ID: columbia-county
    volumes:
      - hell_gate_beat_buswhere:/app/beat
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  hell_gate_beat:
  hell_gate_beat_buswhere:
