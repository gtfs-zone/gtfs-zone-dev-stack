services:
  # Prod is CloudNativePG with a role and database per service. This mirrors that
  # topology (see dev/postgres/init-roles.sql) so ownership and grant problems
  # surface locally instead of in the cluster. The init script only runs on a
  # fresh volume, so switching to it needs `docker compose down -v`, which is
  # what scripts/reset.sh does.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./dev/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  migrate:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    command: railroad-club-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://rt_api:rt_api@db:5432/rt_api
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rt_api:rt_api@db:5432/rt_api
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
      # test-track's vite dev server asks for 8080 but silently drifts to 8081+
      # when that port is taken, so allow the whole range it can land on.
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080","http://localhost:8081","http://localhost:8082","http://localhost:8083","http://localhost:8084","http://localhost:8085","http://localhost:8086","http://localhost:8087","http://localhost:8088","http://localhost:8089"]'
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: admin@local
      TRACCAR_PASSWORD: admin
      TRACCAR_CLIENT_BASE: http://localhost:5055
      INGEST_API_TOKEN: dev-ingest-token
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: ${CAFE_CAR_IMAGE:-cafe-car:local}
    build:
      context: ${CAFE_CAR_DIR:-../cafe-car}
    restart: on-failure
    command: fastapi run src/cafe_car/admin_main.py --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://rt_api:rt_api@db:5432/rt_api
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
      DEBUG: "true"
      # Read-only admin-API access, so /account can show which upstream
      # providers are linked to the signed-in realm account. Keycloak is the
      # only thing that knows the whole list. The account console URL goes
      # through the `keycloak` hostname so the browser and the containers agree
      # on the issuer (the /etc/hosts entry the README documents).
      KEYCLOAK_URL: http://keycloak:8090
      KEYCLOAK_REALM: gtfs
      KEYCLOAK_CLIENT_ID: cafe-car
      KEYCLOAK_CLIENT_SECRET: dev-cafe-car-secret
      KEYCLOAK_ACCOUNT_URL: http://keycloak:8090/realms/gtfs/account
      TRACCAR_URL: http://traccar:8082
      TRACCAR_EMAIL: admin@local
      TRACCAR_PASSWORD: admin
      TRACCAR_CLIENT_BASE: http://localhost:5055
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    image: ${SCHEDULE_FOAMER_IMAGE:-schedule-foamer:local}
    build:
      context: ${SCHEDULE_FOAMER_DIR:-../schedule-foamer}
    command: celery -A schedule_foamer.celery_app worker -l info
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://rt_api:rt_api@db:5432/rt_api
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      FEED_REFRESH_INTERVAL_MINUTES: 10
      CELERY_WORKER_CONCURRENCY: 2
      CELERY_MAX_TASKS_PER_CHILD: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    image: ${SCHEDULE_FOAMER_IMAGE:-schedule-foamer:local}
    build:
      context: ${SCHEDULE_FOAMER_DIR:-../schedule-foamer}
    command: celery -A schedule_foamer.celery_app beat -l info --schedule=/app/beat/celerybeat-schedule
    restart: on-failure
    environment:
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:master
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Keycloak is the OIDC provider for both the admin app (via oauth2-proxy)
  # and Traccar, which is a separate client with its own login.
  #
  # The port is 8090 both inside and outside the container on purpose. The
  # issuer URL is baked into every token, so the browser and the other
  # containers must reach Keycloak at the *identical* URL, hence the
  # `keycloak` /etc/hosts entry the README documents.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm --http-port=8090
    ports:
      - "8090:8090"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_HOSTNAME: http://keycloak:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    healthcheck:
      # The image ships no curl/wget, so talk to the management port over
      # bash's /dev/tcp.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.3
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8090/realms/gtfs
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: dev-oauth2-proxy-secret
      OAUTH2_PROXY_COOKIE_SECRET: ZGV2LWxvY2FsLWNvb2tpZS1zZWNyZXQtMzItYnl0ZXM=
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://admin:8001/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      # `groups` carries Keycloak group membership into the access token, which
      # is how cafe-car decides who is a gtfs-admins admin. No ALLOWED_GROUPS:
      # the admin app stays open to every realm account, and cafe-car's own
      # scoping decides what each of them sees.
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "false"
      # `sub`: a stable Keycloak UUID that survives a display-name change and
      # is the same no matter which upstream provider the user linked. The old
      # `name` value was neither stable nor unique.
      OAUTH2_PROXY_USER_ID_CLAIM: sub
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # /oauth2/sign_out only drops oauth2-proxy's own cookie. Without this,
      # Keycloak's SSO session survives, the bounce back to "/" is silently
      # re-authorized, and logout appears to do nothing. This calls Keycloak's
      # end_session_endpoint server-side so the SSO session dies too.
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http://keycloak:8090/realms/gtfs/protocol/openid-connect/logout?id_token_hint={id_token}
    depends_on:
      keycloak:
        condition: service_healthy
      admin:
        condition: service_started

  vehicle-poser:
    image: ${VEHICLE_POSER_IMAGE:-vehicle-poser:local}
    build:
      context: ${VEHICLE_POSER_DIR:-../vehicle-poser}
    restart: on-failure
    environment:
      HTTP_PORT: 8080
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg2://rt_api:rt_api@db:5432/rt_api
    expose:
      - "8080"
    depends_on:
      - redis
      - migrate

  trip-updogger:
    image: ${TRIP_UPDOGGER_IMAGE:-trip-updogger:local}
    build:
      context: ${TRIP_UPDOGGER_DIR:-../trip-updogger}
    restart: on-failure
    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg2://rt_api:rt_api@db:5432/rt_api
      POLL_INTERVAL: 5
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  traccar:
    image: traccar/traccar:6.14.5
    restart: on-failure
    ports:
      - "8082:8082"
      - "5055:5055"
    volumes:
      - ./dev/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    environment:
      # Same mechanism prod uses, so the env-name mangling trap is exercised
      # here first: Traccar inserts an underscore before each capital, making
      # openid.clientSecret -> OPENID_CLIENT_SECRET, not OPENID_CLIENTSECRET.
      # Spelling it wrong is silent; the container stays healthy and only
      # /api/server 500s. See the comment block in dev/traccar/traccar.xml.
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_PASSWORD: traccar
      OPENID_CLIENT_SECRET: dev-traccar-secret
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vehicle-poser:
        condition: service_started

  hell-gate-bridge:
    image: ${HELL_GATE_BRIDGE_IMAGE:-hell-gate-bridge:local}
    build:
      context: ${HELL_GATE_BRIDGE_DIR:-../hell-gate-bridge}
    restart: on-failure
    environment:
      SOURCE: amtrak
      POLL_INTERVAL: 15
      ROUTE_FILTER:
      CAFE_CAR_INGEST_URL: http://api:8000
      INGEST_API_TOKEN: dev-ingest-token
      # Must equal the amtrak Tracker.id provisioned via scripts/provision_source.py
      # (cafe-car's gtfs_rt.py scans vehicle:{tracker.id}:*).
      INGEST_VEHICLE_ID: amtrak-live
    volumes:
      - hell_gate_beat:/app/beat
    depends_on:
      api:
        condition: service_healthy

  hell-gate-bridge-buswhere:
    image: ${HELL_GATE_BRIDGE_IMAGE:-hell-gate-bridge:local}
    build:
      context: ${HELL_GATE_BRIDGE_DIR:-../hell-gate-bridge}
    restart: on-failure
    environment:
      SOURCE: buswhere
      POLL_INTERVAL: 15
      # Direct raw URL: the github.com/.../raw/ form 302-redirects and hell-gate's
      # httpx client does not follow redirects (fetch_gtfs would fail).
      GTFS_URL: https://raw.githubusercontent.com/columbia-county-ny-transit/gtfs-generator/refs/heads/main/columbia_county_gtfs.zip
      # Blank → poll all mapped Columbia County routes.
      BUSWHERE_ROUTES:
      CAFE_CAR_INGEST_URL: http://api:8000
      INGEST_API_TOKEN: dev-ingest-token
      # Must equal the columbia-county Tracker.id provisioned in cafe-car.
      INGEST_VEHICLE_ID: columbia-county
    volumes:
      - hell_gate_beat_buswhere:/app/beat
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  hell_gate_beat:
  hell_gate_beat_buswhere:
